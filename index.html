<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Emotion Detector</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 60px auto; text-align: center; }
        textarea { width: 100%; height: 100px; font-size: 16px; padding: 8px; box-sizing: border-box; }
        button { margin-top: 12px; padding: 10px 24px; font-size: 16px; cursor: pointer; }
        #system_response { margin-top: 24px; font-size: 16px; }
    </style>
</head>
<body>
    <h1>Emotion Detector</h1>
    <p>Enter a statement and find out its emotion breakdown.</p>

    <textarea id="textToAnalyze" placeholder="Type a sentence here..."></textarea><br>
    <button onclick="RunSentimentAnalysis()">Analyze</button>

    <div id="system_response"></div>

    <script>
        function RunSentimentAnalysis() {
            const text = document.getElementById("textToAnalyze").value;
            const responseEl = document.getElementById("system_response");

            fetch(`/emotionDetector?textToAnalyze=${encodeURIComponent(text)}`)
                .then(response => response.text())
                .then(data => {
                    responseEl.innerText = data;
                });
        }
    </script>
</body>
</html>
